name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
        python-version: ['3.10', '3.13']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run contract tests
        shell: bash
        run: bash scripts/run_tests.sh -q

      - name: Check whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA" HEAD
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            git diff-tree --check --root -r HEAD
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            ROOT_SHA="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            git diff-tree --check --root -r "$ROOT_SHA"
            git diff --check "$ROOT_SHA" HEAD
          else
            git diff --check "$BEFORE_SHA" HEAD
          fi
