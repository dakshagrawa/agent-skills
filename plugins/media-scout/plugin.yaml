name: media-scout
version: 0.2.0
description: "Multi-platform social evidence intake, native review and opt-in thread naming."
author: "Daksh Agrawal (dakshagrawa)"
license: MIT
requires_hermes: ">=0.22.6"
platforms: [linux]
capabilities:
  - gateway.platform_actions
provides_tools:
  - media_scout
provides_hooks:
  - post_gateway_admission
config_schema:
  owner_id:
    type: string
    default: ""
    description: "Discord user ID permitted to create receipts and use this profile-local catalog."
  guild_id:
    type: string
    default: ""
  parent_channel_id:
    type: string
    default: ""
  auto_review:
    type: boolean
    default: false
  review_policy_reference:
    type: string
    default: ""
  review_profile:
    type: string
    default: default
  review_board:
    type: string
    default: media-review
  rename_threads:
    type: boolean
    default: false
    description: "Name captured threads through the separately consented native platform-action facade."
  allow_cleanup:
    type: boolean
    default: false
