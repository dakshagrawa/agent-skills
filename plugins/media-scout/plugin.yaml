name: media-scout
version: 0.1.0
description: "Profile-local media receipt and review bookkeeping; native tools perform extraction and review."
author: "Daksh Agrawal (dakshagrawa)"
license: MIT
requires_hermes: ">=0.22.6"
platforms: [linux]
provides_tools:
  - media_scout
provides_hooks:
  - post_gateway_admission
config_schema:
  owner_id:
    type: string
    default: ""
    description: "Discord user ID permitted to create receipts and use this profile-local catalog."
  guild_id:
    type: string
    default: ""
  parent_channel_id:
    type: string
    default: ""
  auto_review:
    type: boolean
    default: false
  review_policy_reference:
    type: string
    default: ""
  review_profile:
    type: string
    default: default
  review_board:
    type: string
    default: media-review
  allow_cleanup:
    type: boolean
    default: false
